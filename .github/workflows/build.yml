# Runs the tests and builds the app on every push and pull request.
# Pushing a tag like v1.2 also builds a signed release APK and attaches it to a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Decode the signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing; a release must be signed with the release key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KARTKA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          # Tags only (v1.2.3); other builds keep the default version.
          KARTKA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          KARTKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KARTKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KARTKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Name the APK
        run: |
          name="kartka-${GITHUB_REF_NAME//\//-}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "APK=$name" >> "$GITHUB_ENV"

      # Every build: the APK is downloadable from the run's page for 30 days.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          retention-days: 30

      # Tags only: a GitHub release with the signed APK attached.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          generate_release_notes: true
